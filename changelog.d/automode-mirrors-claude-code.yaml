kind: changed
area: pi
change: >
  Auto mode judges a call the way Claude Code's auto mode does, after a day
  spent watching what Claude Code actually sends its classifier. Four things
  changed. Nothing in the conversation is cut any more. Auto mode used to trim
  every message to its head and its tail and drop the middle, which is where a
  delegation brief states what the agent may do, so the classifier refused work
  it had been authorized to do and could not see the authorization. The
  classifier now gets a compact projection of what was said and what was run,
  whole messages only, and the session's opening message rides in a seat of its
  own with no cap at all and a stated policy about what it can authorize: a
  grant naming this operation on this target counts, and "be autonomous" does
  not. Tool calls the agent already made are in the window too, so the
  classifier can see the work leading up to the call it is judging. The two
  passes now ask different questions. The first grades how dangerous the action
  is on its own, cheaply, and is told in so many words not to weigh what the
  user asked for; anything it grades routine runs without a second call. The
  second weighs the user's intent against the rules and answers with a
  severity and the name of the rule it matched, which is what the agent and
  the ledger are now told. There is one refusal a conversation cannot lift,
  data leaving the machine, and everything else can be cleared by a user who
  says plainly what they want done. Turning auto mode off from inside a session
  used to be the second one; it is a refusal the user can now clear, which is
  the difference between attn holding a line against its own user and attn
  trusting a user who says so. And a conversation that will not fit is no
  longer judged on the part that does. Auto mode blocks the call, says nothing
  refused it and no model was asked, and tells the agent to ask the user
  directly, because retrying and approving both reach the same wall. Auto mode
  keeps its own ordered lists of classifier models, walked when one cannot be
  reached; that part is attn's, and it stays.
symptom: >
  A classifier that was shown a trimmed conversation refused work the user had
  already authorized in the part that was trimmed away.
