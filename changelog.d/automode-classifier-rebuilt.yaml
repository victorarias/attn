kind: fixed
area: pi
change: |
  Auto mode's classifier was rebuilt after a day spent watching how Claude
  Code's does the same job. What a pi session sees now:

  - A delegation brief's authorization reaches the classifier. Every message
    used to be cut to its head and tail, and the middle is where a brief says
    what the agent may do. Measured over 29 sessions: every brief was long
    enough to be cut, and no hand-typed prompt ever was. So the classifier
    refused work it had been authorized to do, and could not see the
    authorization.
  - Blocked calls say how to get past them. An approval used to be the only
    advice, and for three kinds of block it was wrong. A model auto mode
    cannot reach now says nothing refused the work and a retry is what gets
    through. A refusal an approval cannot lift says so, and says what does
    lift it. The on-screen list of blocked calls follows the same rule.
  - Two passes ask two questions. The first grades how dangerous the action is
    on its own, cheaply, ignoring what the user asked for; anything routine
    runs without a second call. The second weighs the user's intent and
    answers with the name of the rule it matched, which the agent and the
    record now get told.
  - One refusal a conversation cannot lift: data leaving the machine. Turning
    auto mode off used to be a second one. A user who says plainly what they
    want can now clear it.
  - Nothing about a verdict is remembered. Auto mode used to reuse an earlier
    answer, so an approval could be ignored on the retry and an old yes could
    outlive the conversation that earned it.
  - A conversation too big for the classifier's model asks you. Auto mode does
    not guess beforehand and does not judge on a piece of it. Say yes and the
    call runs, say no and the agent is told to ask rather than retry.
  - Tool calls the agent already made are in the window, so the classifier
    sees the work leading up to the call it is judging.
  - The rules grew from twelve to about fifty, and they are sent in a form
    providers cache, so the second call in a session costs a fraction of the
    first.
  - A blocked call's local record keeps the whole prompt it was judged on, so
    a wrong verdict can be told apart from a window that never carried the
    sentence that mattered.
symptom: |
  A classifier shown a trimmed conversation refused work the user had already
  authorized in the part that was trimmed away, then told the agent to go ask
  for an approval that could not have helped.
