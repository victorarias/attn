kind: added
area: sessions
change: >
  A conversation session now shows what its agent did, not only what it said.
  Every tool call becomes a card in the transcript naming the tool and what it
  was pointed at — the command, the file, the pattern — and whether it worked.
  The cards stay collapsed until you open one, and only then does attn fetch
  what the tool actually read or printed. An output the agent's own tool clipped
  offers the whole of itself, and a file edit draws as a diff.
symptom: >
  A conversation agent that spent two minutes reading files and running commands
  showed nothing at all in between its sentences, so the only way to know what
  it had touched was to ask it.
---
kind: added
area: sessions
change: >
  Anything you have sent a conversation agent that it has not read yet can be
  cancelled. The queue strip has a Cancel all next to it, and it empties once
  the agent confirms the messages are gone.
symptom: >
  A steer or follow-up typed by mistake sat in the queue until the agent read
  it, and there was no way to take it back.
