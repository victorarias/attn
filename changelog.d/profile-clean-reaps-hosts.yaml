kind: fixed
area: cli
change: >
  `attn profile clean` now shuts down a profile's conversation-session host
  processes and plugin runtime processes (such as the attn-pi driver) the same
  way it already reaps its pty-workers. Each of these daemon children leaves a
  durable record at spawn, so a process orphaned by a daemon that died uncleanly
  is found and stopped — cooperatively first, so a host's tool subprocesses are
  torn down too — instead of quietly burning memory after the profile is gone.
