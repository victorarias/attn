kind: fixed
area: pi
change: >
  Auto mode now tells the truth about how to get past a block. Every blocked
  call used to end the same way, asking the user to approve it, and for three
  kinds of block that was wrong: the agent went off asking for something that
  could never help, and the user spent a turn believing they had fixed it.
  When the model auto mode asks about a call cannot be reached, the block now
  says so plainly. Nothing refused the work, retrying is what gets through,
  and no approval will do it. When the refusal is one an approval cannot lift,
  the block says that too, and says what does lift it: a change to auto mode's
  own setup, which the user makes outside the session. A call refused by a
  pattern on the deny list says the same, because the deny list is checked
  again on every attempt however warmly the retry was approved; that one is
  cleared by editing the list, in Settings, where it always was. The on-screen
  list of blocked calls follows the same rule and stops offering an approval
  that would not have worked. An answer auto mode cannot read is no longer
  remembered either. It already told the agent to retry, and a remembered one
  answered the retry from the cache without a model ever seeing the call
  again. Finally, a blocked call's local record now keeps the whole prompt the
  classifier was judged on, so a wrong verdict can be told apart from a
  conversation window that never carried the sentence that mattered. That is
  exactly what went wrong with delegation briefs, and it took replaying real
  calls by hand to find.
symptom: >
  Blocked calls all said the same thing: ask the user to approve it. A
  model-endpoint outage read as a refusal, and a pattern on the deny list
  promised an approval would clear it.
