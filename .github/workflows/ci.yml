name: CI

on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'epic/**']

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      daemon: ${{ steps.filter.outputs.daemon }}
      generated: ${{ steps.filter.outputs.generated }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tauri: ${{ steps.filter.outputs.tauri }}
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            daemon:
              - '**/*.go'
              - 'cmd/**'
              - 'internal/**'
              - 'test/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'scripts/source-fingerprint.sh'
              - 'scripts/claude/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'app/src/**'
              - 'app/e2e/**'
              - 'app/test-harness/**'
              - 'app/public/**'
              - 'app/index.html'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/playwright.config.ts'
              - 'app/tsconfig*.json'
              - 'app/vite.config.ts'
              - 'internal/protocol/schema/**'
              - '.github/workflows/ci.yml'
            # Every input to the type pipeline plus both of its outputs. The
            # outputs are listed so a hand-edit is gated even when no schema
            # moved — that edit is exactly what this catches.
            generated:
              - 'internal/protocol/schema/**'
              - 'internal/protocol/generated.go'
              - 'app/src/types/generated.ts'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            tauri:
              - 'app/src-tauri/**'
              - '.github/workflows/ci.yml'
            plugins:
              - 'plugins/**'
              - 'scripts/build-bundled-plugins.sh'
              - '.tool-versions'
              - '.github/workflows/ci.yml'
  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Gate
        run: ./scripts/changelog-gate.sh "${{ github.base_ref }}" "${{ github.head_ref }}"

  # generated.go and generated.ts are compiled from internal/protocol/schema, and
  # nothing was checking that the committed copies match. The other jobs cannot:
  # the generated TS interfaces carry an `any` index signature, so `tsc` accepts a
  # file with a wire field deleted from it — measured, exit 0. This regenerates
  # from the schema and fails on any difference.
  generated-types:
    name: Generated types
    needs: changes
    if: needs.changes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # The TypeSpec compiler the recipe invokes as `pnpm exec tsp`.
      - name: Install schema toolchain
        working-directory: internal/protocol/schema
        run: pnpm install --frozen-lockfile

      - name: Regenerate and diff
        run: make check-types

  backend:
    name: Daemon
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # internal/ghosttyvt links libghostty-vt via cgo on Linux; fetch the
      # prebuilt native archive (download-first, no zig) so vet/build/test link.
      - name: Ensure native VT library
        run: ./scripts/build-libghostty-vt.sh

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: ./scripts/test-go.sh

      # Repository Claude Code hooks are shell, so the Go suite cannot see them.
      - name: Test repository hooks
        run: bash ./scripts/claude/attn-profile-nudge_test.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run build

      - name: Test
        run: pnpm test

  # E2E runs apart from the unit job so the two overlap instead of stacking.
  # Each shard is its own runner with its own throwaway daemon + Vite server,
  # so the shared-daemon constraint that forces workers:1 in playwright.config
  # still holds within a shard.
  frontend-e2e:
    name: Frontend E2E (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build attn binary
        run: |
          cd ..
          ./scripts/build-libghostty-vt.sh
          go build -o /tmp/attn ./cmd/attn

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # The suite only runs chromium (no projects configured), so skip the
      # firefox/webkit downloads. On a cache hit only the OS packages are needed.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E
        env:
          ATTN_E2E_BIN: /tmp/attn
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

  # Single stable check name over the shard matrix, for branch-protection
  # rulesets. Green when all shards pass or the frontend filter skipped them.
  frontend-e2e-gate:
    name: Frontend E2E
    needs: frontend-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        run: |
          result="${{ needs.frontend-e2e.result }}"
          echo "shards result: $result"
          [ "$result" = "success" ] || [ "$result" = "skipped" ]

  rust:
    name: Tauri
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libclang-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build attn binary
        run: |
          cd ../..
          ./scripts/build-libghostty-vt.sh
          go build -o /tmp/attn ./cmd/attn
          target_triple="$(rustc -vV | awk '/host:/ {print $2}')"
          mkdir -p app/src-tauri/binaries
          cp /tmp/attn "app/src-tauri/binaries/attn-${target_triple}"
          cd app/src-tauri

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Cargo test
        run: cargo test

  # The bundled plugins are compiled by the packaged-app build, which no CI job
  # runs — so a plugin that only builds on a machine with warm node_modules got
  # all the way to a contributor's fresh clone. This stages them the way the app
  # build does, from a checkout that has nothing installed.
  plugins:
    name: Plugins
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read bun pin
        id: bun
        run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Stage bundled plugins
        run: ./scripts/build-bundled-plugins.sh "${RUNNER_TEMP}/bundled-plugins"

      - name: Test plugins
        run: |
          for plugin in plugins/*/; do
            [ -f "${plugin}package.json" ] || continue
            echo ">>> ${plugin}"
            (cd "$plugin" && bun test)
          done
