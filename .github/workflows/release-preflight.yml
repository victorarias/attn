name: Release Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-preflight.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "apphost/**"
      - "scripts/build-app-runtime-host.sh"
  workflow_dispatch:

jobs:
  linux-daemon-preflight:
    name: Linux daemon (${{ matrix.label }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: amd64
            runs_on: ubuntu-24.04
            goarch: amd64
            output: /tmp/attn-linux-amd64
            artifact: attn-linux-amd64
          - label: arm64
            runs_on: ubuntu-24.04-arm
            goarch: arm64
            output: /tmp/attn-linux-arm64
            artifact: attn-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build daemon
        env:
          VERSION: preflight-${{ github.sha }}
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} make build VERSION="${VERSION}" OUTPUT=${{ matrix.output }}

      - name: Validate daemon
        env:
          EXPECTED_VERSION: preflight-${{ github.sha }}
        run: |
          actual_version="$(${{ matrix.output }} --version)"
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch: got '$actual_version', want '$EXPECTED_VERSION'"
            exit 1
          fi
          file ${{ matrix.output }}

      # The release publishes the app runtime host beside the daemon, because a
      # hub installed from a release has no way to build one for a Linux remote.
      # Building it here is what keeps that step from being first exercised on
      # release day.
      - name: Read bun pin
        id: bun
        run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Build app runtime host
        run: |
          bash ./scripts/build-app-runtime-host.sh /tmp/app-runtime-${{ matrix.label }}
          file /tmp/app-runtime-${{ matrix.label }}/attn-app-runtime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7
